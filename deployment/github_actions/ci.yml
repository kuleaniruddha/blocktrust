name: BlockTrust CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm install --prefix blockchain
      - run: npm test --prefix blockchain
