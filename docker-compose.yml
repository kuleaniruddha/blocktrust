services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

